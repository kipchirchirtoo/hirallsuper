name: Release Hirall POS Apps (Desktop, Mobile & Linux)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android POS APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: hirallpos/mobile-app
        run: flutter pub get

      - name: Build Android APK
        working-directory: hirallpos/mobile-app
        run: flutter build apk --release --dart-define=API_URL=https://giftmart.hirall.com/api/v1

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          mv hirallpos/mobile-app/build/app/outputs/flutter-apk/app-release.apk build-output/hirall-mobile-pos.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build-output/hirall-mobile-pos.apk

  build-windows-apps:
    name: Build Windows Desktop (.EXE & .ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        working-directory: hirallpos/desktop-app
        run: flutter pub get

      - name: Build Windows Desktop Release
        working-directory: hirallpos/desktop-app
        run: flutter build windows --release --dart-define=API_URL=https://giftmart.hirall.com/api/v1

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-output
          Compress-Archive -Path hirallpos/desktop-app/build/windows/x64/runner/Release/* -DestinationPath build-output/hirall-pos-desktop-windows.zip

      - name: Build Windows Installer (.EXE)
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $isccPath) {
            & $isccPath hirallpos/desktop-app/windows/installer.iss
          } else {
            Copy-Item "hirallpos/desktop-app/build/windows/x64/runner/Release/hirall_pos.exe" "build-output/hirall-pos-windows-setup.exe"
          }
          if (Test-Path "hirall-pos-windows-setup.exe") {
            Move-Item "hirall-pos-windows-setup.exe" "build-output/hirall-pos-windows-setup.exe" -Force
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: build-output/*

  build-linux-desktop:
    name: Build Linux Desktop (Tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        working-directory: hirallpos/desktop-app
        run: flutter pub get

      - name: Build Linux Desktop Release
        working-directory: hirallpos/desktop-app
        run: flutter build linux --release --dart-define=API_URL=https://giftmart.hirall.com/api/v1

      - name: Package Linux Bundle (.tar.gz)
        run: |
          mkdir -p build-output
          tar -czvf build-output/hirall-pos-desktop-linux.tar.gz -C hirallpos/desktop-app/build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: build-output/hirall-pos-desktop-linux.tar.gz

  create-github-release:
    name: Publish Clean GitHub Release
    needs: [build-android-apk, build-windows-apps, build-linux-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release Directory
        run: mkdir -p release-files

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Normalize & Format Final Release Assets (No Duplicates)
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v2.0.0"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

          # Exactly 1 .apk
          find downloaded-artifacts -name "hirall-mobile-pos.apk" -exec cp {} release-files/hirall-mobile-pos-${TAG}.apk \;
          
          # Exactly 1 .exe installer
          find downloaded-artifacts -name "hirall-pos-windows-setup.exe" -exec cp {} release-files/hirall-pos-windows-${TAG}-setup.exe \;
          
          # Exactly 1 .zip (Windows Portable)
          find downloaded-artifacts -name "hirall-pos-desktop-windows.zip" -exec cp {} release-files/hirall-pos-desktop-windows-${TAG}.zip \;
          
          # Exactly 1 for Linux (.tar.gz)
          find downloaded-artifacts -name "hirall-pos-desktop-linux.tar.gz" -exec cp {} release-files/hirall-pos-desktop-linux-${TAG}.tar.gz \;

          echo "Final release files to upload (Strictly 4 non-duplicate items):"
          ls -lh release-files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Hirall Supermarket POS ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-files/hirall-pos-windows-*-setup.exe
            release-files/hirall-mobile-pos-*.apk
            release-files/hirall-pos-desktop-windows-*.zip
            release-files/hirall-pos-desktop-linux-*.tar.gz
