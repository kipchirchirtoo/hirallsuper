version: '3.8'

services:
  # 1. Central PostgreSQL Database for Giftmart Supermarket
  postgres:
    image: postgres:16-alpine
    container_name: giftmart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: giftmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../hirall-backend/setup_giftmart_db.sql:/docker-entrypoint-initdb.d/01_giftmart_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d giftmart"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Offline Event Queue
  redis:
    image: redis:7-alpine
    container_name: giftmart_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. hirall-backend: Rust Axum Enterprise Engine
  backend:
    build:
      context: ../hirall-backend
      dockerfile: Dockerfile
    container_name: giftmart_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      ENVIRONMENT: development
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/giftmart
      DATABASE_MAX_CONNECTIONS: 20
      REDIS_URL: redis://redis:6379
      JWT_SECRET: giftmart_super_secret_jwt_signing_key_change_in_production_2026
      JWT_REFRESH_SECRET: giftmart_refresh_secret_signing_key_change_in_production_2026
      JWT_EXPIRATION_HOURS: 24
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: giftmart-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
