[package]
name = "hirall-backend"
version = "0.1.0"
edition = "2021"
default-run = "hirall-backend"
description = "HIRALL Enterprise Cloud Backend (Axum + SQLx + Redis + Cloudflare R2)"

[dependencies]
# Web & Async
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full"] }

# Database & SQL
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "bigdecimal"
] }
bigdecimal = { version = "0.4", features = ["serde"] }

# Serialization & Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
urlencoding = "2.1"

# AWS RDS IAM token — hand-rolled SigV4 presigning (no CLI/browser needed)
hmac = "0.12"
sha2 = "0.10"

# Security & Auth
jsonwebtoken = "9.3"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"

# Cache & Queues
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Object Storage (S3 / Cloudflare R2 / MinIO)
aws-config = { version = "1.5", default-features = false }
aws-sdk-s3 = { version = "1.45", default-features = false, features = ["behavior-version-latest"] }

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
